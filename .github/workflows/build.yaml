name: Build

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    container:
      image: archlinux

    steps:
      - name: Install packages
        run: |
          pacman-key --init
          pacman --noconfirm --sync --refresh --sysupgrade base-devel git

      - uses: actions/checkout@v6.0.2
        with:
          submodules: true

      - name: Setup user
        env:
          GPG_KEY: ${{ secrets.GPG_KEY }}
        run: |
          useradd --create-home --home-dir /build --uid 1000 user
          echo "user ALL=(ALL:ALL) NOPASSWD: ALL" >> /etc/sudoers
          sudo -u user mkdir /build/repo

          sudo -u user gpg --import <<< "$GPG_KEY"
          sudo -u user gpg --export "FE3A61A8A1C70F006D5718250AAB0BC4ED614894" | pacman-key --add -
          pacman-key --lsign-key "FE3A61A8A1C70F006D5718250AAB0BC4ED614894"

          sudo -u user cat << EOF > /build/.makepkg.conf
          PACKAGER="Pascal Diehm <pdiehm8@gmail.com>"
          GPGKEY="FE3A61A8A1C70F006D5718250AAB0BC4ED614894"

          PKGEXT=".pkg.tar.zst"
          BUILDENV=(!distcc !color !ccache check sign)
          OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge !debug lto)

          SRCDEST=/build/src
          PKGDEST=/build/pkgs
          BUILDDIR=/build/work
          EOF

      - uses: actions/cache@v5.0.5
        with:
          key: pkgs-${{ github.run_id }}
          restore-keys: pkgs-
          path: /build/pkgs

      - name: Install paru
        run: |
          PRE="$(date "+%s")"
          sudo -u user env -C paru makepkg --noconfirm --syncdeps --install
          POST="$(date "+%s")"
          TIME=$((POST - PRE))

          echo "## Build times" >> "$GITHUB_STEP_SUMMARY"
          printf -- "- %s: %dm %02ds\n" "paru" "$((TIME / 60))" "$((TIME % 60))" >> "$GITHUB_STEP_SUMMARY"

      - name: Build packages
        run: |
          for pkg in */; do
            pkg="${pkg%/}"
            if [[ $pkg != paru ]]; then
              echo "::group::$pkg"
              PRE="$(date "+%s")"

              if [[ -f $pkg.patch ]]; then env -C "$pkg" patch -p 1 < "$pkg.patch"; fi
              sudo -u user env -C "$pkg" paru --noconfirm --build .

              POST="$(date "+%s")"
              echo "::endgroup::"
            fi

            TIME=$((POST - PRE))
            printf -- "- %s: %dm %02ds\n" "$pkg" "$((TIME / 60))" "$((TIME % 60))" >> "$GITHUB_STEP_SUMMARY"

            sudo -u user env -C "$pkg" makepkg --packagelist | while read -r pkg; do
              if [[ ! -f $pkg ]]; then continue; fi
              sudo -u user touch "$pkg" "$pkg.sig"
              sudo -u user cp "$pkg" "$pkg.sig" /build/repo
            done
          done

      - name: Build repository
        run: sudo -u user repo-add --include-sigs --sign --key FE3A61A8A1C70F006D5718250AAB0BC4ED614894 /build/repo/aur.db.tar.gz /build/repo/*.pkg.tar.zst

      - name: Clean cache
        run: find /build/pkgs -mtime +0 -delete

      - name: Print summary
        run: |
          echo "## Files" >> "$GITHUB_STEP_SUMMARY"
          echo "### Repository" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -Alh /build/repo | tail -n +2 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "### Cache" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -Alh /build/pkgs | tail -n +2 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: /build/repo

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    permissions:
      pages: write
      id-token: write

    steps:
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/deploy-pages@v5.0.0
