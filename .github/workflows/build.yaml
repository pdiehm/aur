on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux

    steps:
      - name: Install packages
        run: pacman --noconfirm --sync --refresh --sysupgrade base-devel git

      - uses: actions/checkout@v6.0.2
        with:
          submodules: true

      - name: Setup builder
        run: |
          useradd --create-home --home-dir /build --uid 1000 user
          printf "user ALL=(ALL:ALL) NOPASSWD: ALL\n" >> /etc/sudoers
          sudo -u user mkdir /build/repo

          sudo -u user cat << EOF > /build/.makepkg.conf
          PACKAGER="Pascal Diehm <pdiehm8@gmail.com>"
          OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge !debug lto)

          SRCDEST=/build/src
          PKGDEST=/build/pkgs
          BUILDDIR=/build/work
          EOF

      - uses: actions/cache@v5.0.5
        with:
          key: pkgs
          path: /build/pkgs

      - name: Install paru
        run: |
          PRE="$(date "+%s")"
          sudo -u user env -C paru makepkg --noconfirm --syncdeps --install
          POST="$(date "+%s")"
          TIME=$((POST - PRE))

          echo "## Build times" >> "$GITHUB_STEP_SUMMARY"
          printf -- "- %s: %dm %02ds\n" "paru" "$((TIME / 60))" "$((TIME % 60))" >> "$GITHUB_STEP_SUMMARY"

      - name: Build packages
        run: |
          for pkg in */; do
            pkg="${pkg%/}"
            if [[ $pkg != paru ]]; then
              echo "::group::$pkg"
              PRE="$(date "+%s")"

              if [[ -f $pkg.patch ]]; then env -C "$pkg" patch -p 1 < "$pkg.patch"; fi
              sudo -u user env -C "$pkg" paru --noconfirm --build .

              POST="$(date "+%s")"
              echo "::endgroup::"
            fi

            TIME=$((POST - PRE))
            printf -- "- %s: %dm %02ds\n" "$pkg" "$((TIME / 60))" "$((TIME % 60))" >> "$GITHUB_STEP_SUMMARY"

            sudo -u user env -C "$pkg" makepkg --packagelist | while read -r pkg; do
              if [[ ! -f $pkg ]]; then continue; fi
              sudo -u user touch "$pkg"
              sudo -u user cp "$pkg" /build/repo
            done
          done

      - name: Build repository
        run: repo-add /build/repo/aur.db.tar.gz /build/repo/*

      - name: Clean cache
        run: if [[ -d /build/pkgs ]]; then find /build/pkgs -mtime +7 -delete; fi

      - name: Print summary
        run: |
          echo "## Files" >> "$GITHUB_STEP_SUMMARY"
          echo "### Repository" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -Alh /build/repo | tail -n +2 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "### Cache" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -Alh /build/pkgs | tail -n +2 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: /build/repo

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    permissions:
      pages: write
      id-token: write

    steps:
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/deploy-pages@v5.0.0
