name: Build

on:
  workflow_dispatch:

  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  schedule:
    - cron: "0 0 * * *"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    container:
      image: archlinux

    steps:
      - name: Install Packages
        run: pacman --noconfirm --sync --refresh --sysupgrade base-devel git

      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Setup Environment
        env:
          GPG_KEY: ${{ secrets.GPG_KEY }}
        run: |
          useradd --create-home --home-dir /build --uid 1000 user
          echo "user ALL=(ALL:ALL) NOPASSWD: ALL" >> /etc/sudoers
          sudo -u user mkdir /build/repo
          chown -R user:user .

          if [[ $GPG_KEY ]]; then
            pacman-key --init
            sudo -u user gpg --import <<< "$GPG_KEY"
            sudo -u user gpg --export "FE3A61A8A1C70F006D5718250AAB0BC4ED614894" | pacman-key --add -
            pacman-key --lsign-key "FE3A61A8A1C70F006D5718250AAB0BC4ED614894"
          fi

          cat << EOF > /build/.makepkg.conf
          PACKAGER="Pascal Diehm <pdiehm8@gmail.com>"
          GPGKEY="FE3A61A8A1C70F006D5718250AAB0BC4ED614894"

          PKGEXT=".pkg.tar.zst"
          BUILDENV=(!distcc !color !ccache check sign)
          OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge !debug lto)

          SRCDEST=/build/src
          PKGDEST=/build/pkgs
          BUILDDIR=/build/work
          EOF

          if [[ ! $GPG_KEY ]]; then
            sed -i "s/sign/!sign/" /build/.makepkg.conf
            sed -i "s/^LocalFileSigLevel = .*/LocalFileSigLevel = Never/" /etc/pacman.conf
          fi

      - uses: actions/cache/restore@v6.1.0
        with:
          key: pkgs-${{ github.run_id }}
          restore-keys: pkgs-
          path: |
            /build/pkgs
            /var/cache/pacman/pkg

      - name: Build Packages
        run: |
          echo "## Build times" >> "$GITHUB_STEP_SUMMARY"
          echo "| Package | Build time |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"

          while read -ru 3 -a pkg; do
            for pkg in "${pkg[@]}"; do
              echo "::group::$pkg"
              PRE="$(date "+%s")"

              if [[ -f $pkg.patch ]]; then env -C "$pkg" patch -p 1 < "$pkg.patch"; fi
              if [[ $pkg == paru ]]; then CMD=(makepkg --noconfirm --syncdeps --install); else CMD=(paru --noconfirm --install --build .); fi
              sudo -u user env -C "$pkg" "${CMD[@]}"

              POST="$(date "+%s")"
              echo "::endgroup::"

              TIME="$((POST - PRE))"
              printf "| %s | %dm %02ds |\n" "$pkg" "$((TIME / 60))" "$((TIME % 60))" >> "$GITHUB_STEP_SUMMARY"

              sudo -u user env -C "$pkg" makepkg --packagelist | while read -r pkg; do
                if [[ ! -f $pkg || ! -f $pkg.sig ]]; then continue; fi
                sudo -u user touch "$pkg" "$pkg.sig"
                sudo -u user cp "$pkg" "$pkg.sig" /build/repo
              done
            done
          done 3< PKGS.txt

      - name: Build Repository
        if: github.ref_name == 'main'
        run: sudo -u user repo-add --include-sigs --sign --key FE3A61A8A1C70F006D5718250AAB0BC4ED614894 /build/repo/aur.db.tar.gz /build/repo/*.pkg.tar.zst

      - name: Print Summary
        if: github.ref_name == 'main'
        run: |
          echo "## Packages" >> "$GITHUB_STEP_SUMMARY"
          echo "| Package | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"

          ls -lh /build/repo/*.pkg.tar.zst | tail -n +2 | while read -r _ _ _ _ size _ _ _ file _; do
            printf "| %s | %s |\n" "${file##*/}" "$size" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Clean Cache
        if: github.ref_name == 'main'
        run: find /build/pkgs -mindepth 1 -mtime +0 -delete

      - uses: actions/cache/save@v6.1.0
        if: github.ref_name == 'main'
        with:
          key: pkgs-${{ github.run_id }}
          path: |
            /build/pkgs
            /var/cache/pacman/pkg

      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.ref_name == 'main'
        with:
          path: /build/repo

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_name == 'main'

    permissions:
      pages: write
      id-token: write

    steps:
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/deploy-pages@v5.0.1
