name: Upgrade

on:
  schedule:
    - cron: "0 0 * * 6"

jobs:
  upgrade:
    name: Upgrade
    runs-on: ubuntu-latest

    container:
      image: archlinux

    permissions:
      contents: write

    steps:
      - name: Install Packages
        run: |
          pacman --noconfirm --sync --refresh --sysupgrade base-devel devtools nvchecker git github-cli
          sed -i "s/return 1/return 0/" /usr/share/devtools/lib/util/term.sh

      - uses: actions/checkout@v7.0.1

      - name: Setup User
        run: |
          useradd --create-home user
          echo "user ALL=(ALL:ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R user:user .

      - name: Upgrade
        run: |
          for pkg in */.nvchecker.toml; do
            pkg="${pkg%/*}"
            sudo -u user env -C "$pkg" pkgctl version upgrade
            sudo -u user git add "$pkg/PKGBUILD"
          done

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.PR_TOKEN }}
        run: |
          if ! sudo -u user git diff --staged --quiet; then
            chown -R root:root .
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            BRANCH="upgrade/$(date "+%F")"
            git checkout -b "$BRANCH"

            git commit --message "chore: upgrade"
            git push --set-upstream origin "$BRANCH"
            gh pr create --fill --base main --head "$BRANCH"
          fi
